name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DELPHI_BUILD: D:\IA\Framework\delphi-build

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build test suite
        shell: bash
        run: |
          cd "$DELPHI_BUILD"
          python app.py build --project sidekiq4delphi-tests --target Build

      - name: Run unit tests
        shell: bash
        run: tests/bin/Debug/Sidekiq4D.Tests.exe

      - name: Build all examples
        shell: bash
        run: |
          cd "$DELPHI_BUILD"
          PROJECTS=(
            sidekiq4delphi-basic-console
            sidekiq4delphi-scheduled
            sidekiq4delphi-batch
            sidekiq4delphi-concurrency
            sidekiq4delphi-middleware
            sidekiq4delphi-reliability
            sidekiq4delphi-retry
            sidekiq4delphi-sqlite
            sidekiq4delphi-vcl-demo
          )
          for proj in "${PROJECTS[@]}"; do
            echo "Building $proj..."
            python app.py build --project $proj --target Build
          done
          echo "All projects built successfully"

      - name: Package source
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p dist
          # Create source archive (exclude build artifacts)
          tar czf dist/sidekiq4d-${VERSION}-source.tar.gz \
            --exclude='**/dcu' --exclude='**/bin' \
            --exclude='*.dcu' --exclude='*.exe' --exclude='*.res' \
            src/ examples/ tests/ docs/ \
            README.md LICENSE AGENTS.md .gitignore

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cat > dist/RELEASE_NOTES.md << NOTES
          ## Sidekiq4D v${VERSION}

          ### Highlights
          - 56 framework units (40 core + 16 adapters)
          - 9 queue adapters (SQS, RabbitMQ, Kafka, Azure, Google, Redis, HTTP, TCP)
          - 6 middlewares (Logging, Timeout, Dedup, Compression, Prometheus, Circuit Breaker)
          - 5 state stores (InMemory, SQLite, Postgres, Redis, MongoDB)
          - 22 runnable examples
          - Benchmark: 4.2x throughput vs manual loop

          ### Requirements
          - Delphi 11 Alexandria or later
          - No mandatory external dependencies

          ### Installation
          Clone and add \`src/\` to your project search path.
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/sidekiq4d-${{ steps.version.outputs.VERSION }}-source.tar.gz
          draft: false
          prerelease: false
