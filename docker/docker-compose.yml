# ── Sidekiq4D — Infraestrutura local de desenvolvimento ──────────────────
#
# Cobre todos os adapters testáveis sem conta cloud:
#   Redis, PostgreSQL, MongoDB, RabbitMQ, Kafka (+REST Proxy),
#   LocalStack (SQS), Google Pub/Sub emulator, Jaeger (OTLP).
#
# Uso rápido:
#   docker compose up -d                     # sobe tudo
#   docker compose up redis postgres         # só o necessário
#   docker compose down                      # para e remove containers
#   docker compose down -v                   # remove também os volumes
#
# Strings de conexão para o worker Sidekiq4D:
#   Redis:            redis://localhost:6379
#   PostgreSQL:       host=localhost port=5432 dbname=sidekiq4d user=sidekiq4d password=sidekiq4d
#   MongoDB:          mongodb://localhost:27017
#   RabbitMQ HTTP:    http://sidekiq4d:sidekiq4d@localhost:15672
#   Kafka REST Proxy: http://localhost:8082
#   SQS (LocalStack): http://localhost:4566  region=us-east-1
#   Google Pub/Sub:   http://localhost:8085  project=sidekiq4d-local
#   Jaeger OTLP HTTP: http://localhost:4318
#   Jaeger UI:        http://localhost:16686

services:

  # ── Redis ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sidekiq4d-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sidekiq4d-postgres
    environment:
      POSTGRES_DB:       sidekiq4d
      POSTGRES_USER:     sidekiq4d
      POSTGRES_PASSWORD: sidekiq4d
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidekiq4d -d sidekiq4d"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── MongoDB ────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: sidekiq4d-mongodb
    environment:
      MONGO_INITDB_DATABASE: sidekiq4d
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── RabbitMQ ───────────────────────────────────────────────────────────
  # Adapter usa HTTP Management API (porta 15672), não AMQP direto.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sidekiq4d-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sidekiq4d
      RABBITMQ_DEFAULT_PASS: sidekiq4d
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI + HTTP API
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Kafka (KRaft — sem Zookeeper) ──────────────────────────────────────
  kafka:
    image: apache/kafka:latest
    container_name: sidekiq4d-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # Adapter Sidekiq4D usa Confluent REST Proxy (HTTP) — não fala direto com Kafka.
  kafka-rest:
    image: confluentinc/cp-kafka-rest:latest
    container_name: sidekiq4d-kafka-rest
    environment:
      KAFKA_REST_HOST_NAME: kafka-rest
      KAFKA_REST_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_REST_LISTENERS: http://0.0.0.0:8082
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ── LocalStack (SQS) ───────────────────────────────────────────────────
  localstack:
    image: localstack/localstack:3
    container_name: sidekiq4d-localstack
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
      LOCALSTACK_HOST: localhost
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # ── Google Pub/Sub Emulator ────────────────────────────────────────────
  pubsub:
    image: google/cloud-sdk:slim
    container_name: sidekiq4d-pubsub
    environment:
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    command: bash -c "apt-get install -y -qq google-cloud-cli-pubsub-emulator && gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=sidekiq4d-local"
    ports:
      - "8085:8085"
    restart: unless-stopped

  # ── Jaeger (OTLP traces) ───────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: sidekiq4d-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "4318:4318"    # OTLP HTTP (Sidekiq4D envia aqui)
      - "16686:16686"  # UI web
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  rabbitmq_data:
    driver: local
  localstack_data:
    driver: local
